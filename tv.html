<!DOCTYPE html>
<html>

<head>
    <script src="config.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="draft.css">
    <style>
        #player-info {
            margin: 0;
            padding: 0;
        }

        #movie-pic {
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            align-self: center;
            display: none;
        }

        #movie-draw,
        #evaluationscreen {
            background-color: rgba(19, 19, 19, 0.5);
            height: 100vh;
            width: 100vw;
            justify-content: space-between;
            display: flex;
            flex-direction: column;
        }

        #start {
            text-align: center;
            height: 30px;
            width: 70px;
            align-self: center;
        }

        #image {
            max-height: 50vh;
            max-width: 30vw;
        }

        #movie-name {
            text-align: center;
            text-decoration: underline;
            font-weight: bold;
            display: none;
        }

        #bids {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        input {
            background-color: black;
            color: whitesmoke;
            border-radius: 8px;
            border: 0px;
            height: 30px;
            width: 50vw;
        }

        input::placeholder {
            text-align: center;
        }

        #p1bid,
        #p2bid {
            display: none;
        }

        #submit,
        #evaluate {
            text-align: center;
            height: 30px;
            width: 130px;
            display: none;
            align-self: center;
        }

        button {
            background-color: black;
            color: whitesmoke;
            border: 0px;
            font-size: 20px;
            font-weight: 0;
            transition: all 0.2s ease-in-out;
            border-radius: 10px;
            height: 30px;
            width: 130px;
            align-self: center;
            text-align: center;
        }

        button:hover {
            color: black;
            background-color: whitesmoke;
            cursor: pointer;
            text-shadow: 0 0 5px #fff;
        }

        #player-info {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #p1_info,
        #p2_info {
            display: flex;
            flex-direction: column;
        }

        #evaluationscreen {
            display: none;
            background-color: rgb(19, 17, 17);
            height: 92vh;
            width: 85vw;
            border-radius: 30px;
        }

        #evaluationscreen img {
            height: 360px;
            width: 240px;
        }

        #playereval {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        #evalbuttons {
            gap: 5px;
            display: flex;
            flex-direction: row;
            margin-top: 0;
            align-items: center;
        }

        #finalscreen {
            display: none;
            background-color: rgb(19, 17, 17);
            height: 98vh;
            width: 85vw;
            border-radius: 30px;
        }

        #results {
            display: none;
            width: fit-content;
            text-align: center;
            align-self: center;
        }

        #winner,
        #totalscore {
            text-align: center;
        }

        #winner {
            color: green;
            justify-content: center;
        }

        #round {
            text-align: center;
        }

        #stuck {
            display: none;
        }

        #fscore1,
        #fscore2 {
            text-align: center;
        }
        #home{
            background-image: url(images/tvbg.jpg);
        }

        #ftotalscores {
            text-align: center;
        }

        #winner {
            text-align: center;
            font-weight: bolder;
            text-decoration: solid
        }

        #player1images img , #player2images img{
            height: 135px;
            width: 90px;
        }

        #playerimages{
            display:flex;
            flex-direction: column;
            gap: 40px;
        }

        #player1images, #player2images{
            display:flex;
            flex-direction: row;
            justify-content: space-around;
        }

        #vs{
            text-align: center;
        }

    </style>
</head>

<body>
    <div id="home">
        <div id="movie-draw">
            <div id="player-info">
                <div id="p1_info">
                    <div id="p1"></div><br>
                    <div id="p1_pick0"></div>
                    <div id="p1_pick1"></div>
                    <div id="p1_pick2"></div>
                    <div id="p1_pick3"></div>
                    <div id="p1_pick4"></div>
                </div><br>
                <div id="p2_info">
                    <div id="p2"></div><br>
                    <div id="p2_pick0"></div>
                    <div id="p2_pick1"></div>
                    <div id="p2_pick2"></div>
                    <div id="p2_pick3"></div>
                    <div id="p2_pick4"></div>
                </div>
            </div>
            <div id="movie-name"></div>
            <div id="movie-pic"><img id="image"></div>
            <button id="start" onclick="drawfunc()">Start</button>
            <div id="bids">
                <input type="number" placeholder="Player 1's bid" id="p1bid" min="0"
                    oninput="validity.valid||(value='');">
                <input type="number" placeholder="Player 2's bid" id="p2bid" min="0"
                    oninput="validity.valid||(value='');">
            </div>
            <button id="submit" onclick="submit()">Submit bid</button>
            <button id="stuck" onclick="stuck()"> Stuck</button>
            <button id="evaluate" onclick="evaluationfunc()">Evaluate</button>
            <div id="error"></div>


        </div>

        <!--  FOR EVALUATION SCREEN  -->

        <div id="evaluationscreen">
            <div id="round"></div>
            <div id="playereval">
                <div id="player1eval">
                    <img id="player1poster">
                    <div id="player1movie"></div>
                    <div id="player1score"></div>
                </div>
                <div id="player2eval">
                    <img id="player2poster">
                    <div id="player2movie"></div>
                    <div id="player2score"></div>
                </div>
            </div>
            <div id="score1"></div>
            <div id="score2"></div>
            <div id="totalscore"></div>
            <div id="evalbuttons">
                <button id="nextevaluation" onclick="nexteval()">Next Round</button>
                <button id="skipevaluation" onclick="skipeval()">Skip </button>
                <button id="results" onclick="showresults()">Show Results</button>
            </div>
        </div>
        <div id="finalscreen">
            <div id="fscore1"></div><br>
            <div id="fscore2"></div><br>
            <div id="ftotalscores"></div>
            <div id="winner"></div><br>
            <div id="playerimages">
            <div id="player1images">
                <img id="p1m0">
                <img id="p1m1">
                <img id="p1m2">
                <img id="p1m3">
                <img id="p1m4">
            </div>     
            <p id="vs">VS</p>       
            <div id="player2images">
                <img id="p2m0">
                <img id="p2m1">
                <img id="p2m2">
                <img id="p2m3">
                <img id="p2m4">
            </div>
            </div><br>
            <button id="homeb" onclick="home()">Home</button><br>
            <button id="Movies" onclick="movieshome()">Play again</button>
        </div>
    </div>

    </div>
    <script href="draft.js"></script>
    <script>
        var i;
        const API_KEY = window.APP_CONFIG.API_KEY;
        //const movie_array = ["Dirty Dancing", "12 Angry Men", "Girl,Interrupted", "The silence of the lambs", "The Good The Bad & The Ugly", "The Holdovers", "The Goodfellas", "Dead Poets Society", "Perfect Blue", "Spirited Away", "Babylon", "Starwars Revenge of the Sith", "Mulholland Drive", "The Conjuring", "Spider-Man Across the Spider-Verse", "Eternal Sunshine of the spotless mind", "The Batman", "Titanic", "The Shining", "Avatar", "Blade Runner 2049"];
        //const points_array = [3.8, 4.6, 4.0, 4.3, 4.5, 4.3, 4.5, 4.4, 4.4, 4.4, 3.9, 4.1, 4.3, 3.6, 4.4, 4.2, 4.1, 3.8, 4.2, 3.8, 4.1];
        const movie_array = [];
        const points_array = [];
        const poster_array = [];
        var p1_money = 20;
        var p2_money = 20;
        var a = 0;
        var b = 0;
        var startingplayer = 1;

        const p1 = localStorage.getItem("p1o") || "Player 1";
        const p2 = localStorage.getItem("p2o") || "Player 2";


        document.getElementById("evaluationscreen").style.display = "none";

        async function load() {
            for (let page = 1; page <= 10; page++) {
                const res = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&language=en-US&sort_by=vote_count.desc&page=${page}`);
                const data = await res.json();
                data.results.forEach(function func(m) {
                    if (m.poster_path) {
                        movie_array.push(m.name);
                        points_array.push(Number(m.vote_average));
                        poster_array.push("https://image.tmdb.org/t/p/w500" + m.poster_path);
                    }
                });
            }
        }

        load();

        console.log("Total movies loadaed:", movie_array.length)
        document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
        document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;

        function drawfunc() {
            i = Math.floor(Math.random() * movie_array.length);
            document.getElementById("p1bid").value = "";
            document.getElementById("p2bid").value = "";
            document.getElementById(`p${startingplayer}bid`).value = 1;
            document.getElementById(`p${startingplayer}bid`).min = 1;

            if (startingplayer == 1) {
                startingplayer = 2;
            }
            else if (startingplayer == 2) {
                startingplayer = 1;
            }

            document.getElementById("movie-name").innerHTML = movie_array[i];
            document.getElementById("movie-name").style.display = "block";
            document.getElementById("movie-pic").style.display = "block";
            document.getElementById("image").src = poster_array[i];
            document.getElementById("start").style.display = 'none';
            document.getElementById("submit").style.display = "block";
            document.getElementById("p1bid").style.display = "block";
            document.getElementById("p2bid").style.display = "block";
            document.getElementById("stuck").style.display = "block";

        };

        const p1_pick = ["string"], p1_pick_score = [1], p2_pick = ["string"], p2_pick_score = [1], p1_pick_poster = [], p2_pick_poster = [];

        function submit() {
            const p1bid = parseInt(document.getElementById("p1bid").valueAsNumber) || 0;
            const p2bid = parseInt(document.getElementById("p2bid").valueAsNumber) || 0;

            if (p1bid <= p1_money && p2bid <= p2_money) {

                if (p1bid > p2bid && a != 5) {
                    p1_money = p1_money - p1bid;
                    document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
                    p1_pick[a] = movie_array[i];
                    p1_pick_poster[a] = poster_array[i]
                    p1_pick_score[a] = points_array[i];
                    document.getElementById(`p1_pick${a}`).innerHTML = p1_pick[a];

                    if (a + b == 9) {
                        document.getElementById("submit").innerHTML = "Finish";
                        p1_money=100;
                        p2_money=100;
                    }
                    a++;
                    drawfunc();
                }

                else if (a == 5 && b != 5 && p1bid > p2bid) {
                    alert(p1 + " Please do not enter bid, maximum items already drafted");
                }

                else if (b == 5 && a != 5 && p1bid < p2bid) {
                    alert(p2 + " Please do not enter bid, maximum items already drafted");
                }


                else if (p2bid > p1bid && b != 5) {
                    p2_money = p2_money - p2bid;
                    document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;
                    p2_pick[b] = movie_array[i];
                    p2_pick_score[b] = points_array[i];
                    p2_pick_poster[b] = poster_array[i]
                    document.getElementById(`p2_pick${b}`).innerHTML = p2_pick[b];
                    if (a + b == 9) {
                        document.getElementById("submit").innerHTML = "Finish";                        
                        p1_money=100;
                        p2_money=100;
                    }
                    b++;
                    drawfunc();
                }

                else if (b == 5 && a != 5) {
                    p1_money = 1000;
                    p1_bid = 20;
                    p2_bid = 0;
                    drawfunc();
                    document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
                    document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;

                }

                else if (p1bid == p2bid) {
                    alert("equal bid, change the bid");
                }
                else if (a == 5 && b == 5) {
                    evaluationfunc();
                }

            }
            else if (p1bid > p1_money || p2bid > p2_money) {
                alert("Entered bid exceeds balance");
            }
            else {
                alert("Invalid bid");
            }
        }

        var l = 0;
        var forp=0,forpo=0;
        var score1 = 0, score2 = 0, points1 = 0, points2 = 0, calculated1 = 0, calculated2 = 0;

        function evaluationfunc() {
            if (a == 5 && b == 5) {
                document.getElementById("movie-draw").style.display = "none";
                document.getElementById("evaluationscreen").style.display = "flex";
                document.getElementById("evaluationscreen").style.flexDirection = "column";




                document.getElementById("player1movie").innerHTML = p1_pick[l];
                document.getElementById("player1poster").src = p1_pick_poster[l];
                document.getElementById("player1score").innerHTML = p1_pick_score[l];

                document.getElementById("player2movie").innerHTML = p2_pick[l];
                document.getElementById("player2poster").src = p2_pick_poster[l];
                document.getElementById("player2score").innerHTML = p2_pick_score[l];

                points1 = p1_pick_score[l] + points1;
                points2 = p2_pick_score[l] + points2;

                var round = l + 1;
                document.getElementById("totalscore").innerHTML = p1 + "'s total rating is : " + points1 + " " + p2 + "'s total rating is : " + points2;
                document.getElementById("round").innerHTML = "ROUND " + round;



                if (p1_pick_score[l] > p2_pick_score[l]) {
                    score1++;
                    document.getElementById("player1score").style.color = "green";
                    document.getElementById("player2score").style.color = "whitesmoke";
                    document.getElementById("player1poster").style.boxShadow = "0 0 40px green";
                    document.getElementById("player2poster").style.boxShadow = "0 0 0 green";
                }

                else if (p1_pick_score[l] < p2_pick_score[l]) {
                    document.getElementById("player2score").style.color = "green";
                    document.getElementById("player1score").style.color = "whitesmoke";
                    document.getElementById("player2poster").style.boxShadow = "0 0 40px green";
                    document.getElementById("player1poster").style.boxShadow = "0 0 0 green";
                    score2++;
                }

                else {
                    document.getElementById("player2score").style.color = "whitesmoke";
                    document.getElementById("player1score").style.color = "whitesmoke";
                    document.getElementById("player2poster").style.boxShadow = "0 0 0 green";
                    document.getElementById("player1poster").style.boxShadow = "0 0 0 green";
                }

                document.getElementById("score1").innerHTML = p1 + " : " + score1;
                document.getElementById("score2").innerHTML = p2 + " : " + score2;
                l++;
                verdictfunc();
            }
        }

        function nexteval() {
            if (l <= 4) {
                evaluationfunc();
                verdictfunc();
            }
        }

        function skipeval() {
            while (l <= 4) {
                evaluationfunc();
                verdictfunc();
            }
        }

        function verdictfunc() {
            if (l == 5) {
                document.getElementById("results").style.display = "block";
                document.getElementById("nextevaluation").style.display = "none";
                document.getElementById("skipevaluation").style.display = "none";
            }
        }

        function showresults() {
            document.getElementById("finalscreen").style.display = "flex";
            document.getElementById("finalscreen").style.flexDirection = "column";
            document.getElementById("evaluationscreen").style.display = "none";

            document.getElementById("fscore1").innerHTML = p1 + "'s score is: " + score1;
            document.getElementById("fscore2").innerHTML = p2 + "'s score is: " + score2;

            calculated1 = score1 * 5 + points1 * 5;
            calculated2 = score2 * 5 + points2 * 5;

            document.getElementById("ftotalscores").innerHTML = p1 + "'s total rating is: " + points1 + "  " + p2 + "'s total rating is: " + points2;
            if (calculated1 > calculated2) {
                document.getElementById("winner").innerHTML = p1 + " WINS!!!!";
                forp=1;
                forpo=2;
            }
            else if (calculated2 > calculated1) {
                document.getElementById("winner").innerHTML = p2 + " WINS!!!!";
                forp=2;
                forpo=1;
            }
            for (let p=0;p<=4;p++){
                document.getElementById(`p1m${p}`).src= p1_pick_poster[p];
                document.getElementById(`p2m${p}`).src= p2_pick_poster[p];
                document.getElementById(`p${forp}m${p}`).style.boxShadow= "0 0 40px green";
                document.getElementById(`p${forpo}m${p}`).style.boxShadow= "0 0 0px green";
            }
            

        }

        function stuck() {
            p1_money += 10;
            p2_money += 10;
            document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
            document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;

        }

        function home() {
            window.location.href = "/";
        }

        function movieshome() {
            window.location.href = "tv.html";
        }

    </script>
</body>

</html>
