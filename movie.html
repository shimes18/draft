<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="draft.css">
    <style>
        #player-info {
            margin: 0;
        }

        #movie-pic {
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            align-self: center;
            display: none;
        }

        #movie-draw {
            background-color: rgba(19, 19, 19, 0.5);
            height: 95vh;
            width: 95vw;
            justify-content: space-between;
            display: flex;
            flex-direction: column;
        }

        #start {
            text-align: center;
            height: 30px;
            width: 70px;
            align-self: center;
        }

        #image {
            max-height: 50vh;
            max-width: 30vw;
        }

        #movie-name {
            text-align: center;
            text-decoration: underline;
            font-weight: bold;
            display: none;
        }

        #bids {
            display: flex;
            justify-content: space-between;
        }

        input {
            background-color: black;
            color: whitesmoke;
            border-radius: 10px;
            border: 0px;
            height: 30px;
            width: 45vw;
        }

        input::placeholder {
            text-align: center;
        }

        #submit {
            margin-top: -20px;
            text-align: center;
            height: 30px;
            width: 130px;
            align-self: center;
            display: none;
        }

        button {
            background-color: #3ec1e2;
            color: whitesmoke;
            border: 0px;
            font-size: 20px;
            transition: all 0.2s ease-in-out;
            border-radius: 10px;
        }

        button:hover {
            color: #3ec1e2;
            background-color: whitesmoke;
            cursor: pointer;
            transform: scale(1.2);
            text-decoration-line: underline;
            text-shadow: 0 0 5px #fff;
        }

        #player-info {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #p1_info,
        #p2_info {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div id="home">
        <div id="movie-draw">
            <div id="player-info">
                <div id="p1_info">
                    <div id="p1"></div>div><br>
                    <div id="p1_pick0"></div>
                    <div id="p1_pick1"></div>
                    <div id="p1_pick2"></div>
                    <div id="p1_pick3"></div>
                    <div id="p1_pick4"></div>
                </div><br>
                <div id="p2_info">
                    <div id="p2"></div><br>
                    <div id="p2_pick0"></div>
                    <div id="p2_pick1"></div>
                    <div id="p2_pick2"></div>
                    <div id="p2_pick3"></div>
                    <div id="p2_pick4"></div>
                </div>check
            </div>
            <div id="movie-name"></div>
            <div id="movie-pic"><img id="image"></div>
            <button id="start" onclick="drawfunc()">Start</button>
            <div id="bids">
                <input type="number" placeholder="Player 1's bid" id="p1bid" min="0" oninput="validity.valid||(value='');">
                <input type="number" placeholder="Player 2's bid" id="p2bid" min="0" oninput="validity.valid||(value='');">
            </div>
            <button id="submit" onclick="submit()">Submit bid</button>
            <div id="error"></div>
        </div>
    </div>

    </div>
    <script>
        var i;
        const API_KEY = "144a4aff983161b01fa78d7517576fae"
        //const movie_array = ["Dirty Dancing", "12 Angry Men", "Girl,Interrupted", "The silence of the lambs", "The Good The Bad & The Ugly", "The Holdovers", "The Goodfellas", "Dead Poets Society", "Perfect Blue", "Spirited Away", "Babylon", "Starwars Revenge of the Sith", "Mulholland Drive", "The Conjuring", "Spider-Man Across the Spider-Verse", "Eternal Sunshine of the spotless mind", "The Batman", "Titanic", "The Shining", "Avatar", "Blade Runner 2049"];
        //const points_array = [3.8, 4.6, 4.0, 4.3, 4.5, 4.3, 4.5, 4.4, 4.4, 4.4, 3.9, 4.1, 4.3, 3.6, 4.4, 4.2, 4.1, 3.8, 4.2, 3.8, 4.1];
        const movie_array=[];
        const points_array=[];
        const poster_array=[];
        var p1_money = 20;
        var p2_money = 20;
        var a = 0;
        var b = 0;

        const p1="Player 1";
        const p2="Player 2"; 

        async function load() {
            for (let page=1;page<=3;page++){
                const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&page=${page}`);
                const data= await res.json();
                data.results.forEach(function func(m){
                    if (m.poster_path){
                        movie_array.push(m.title);
                        points_array.push(Number(m.vote_average));
                        poster_array.push("https://image.tmdb.org/t/p/w500" + m.poster_path);
                    }
                });
            }
        }
        load();
        document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
        document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;

        function drawfunc() {
            i = Math.floor(Math.random() * movie_array.length);
            document.getElementById("movie-name").innerHTML = movie_array[i];
            document.getElementById("movie-name").style.display = "block";
            document.getElementById("movie-pic").style.display = "block";
            document.getElementById("image").src = poster_array[i];
            document.getElementById("start").style.display = 'none';
            document.getElementById("submit").style.display="block";
        };

        const p1_pick = ["string"], p1_pick_score = [1], p2_pick = ["string"], p2_pick_score = [1];

        function submit() {
            const p1bid = parseInt(document.getElementById("p1bid").valueAsNumber) || 0;
            const p2bid = parseInt(document.getElementById("p2bid").valueAsNumber) || 0;

            if (p1bid <= p1_money && p2bid <= p2_money) {

                if (p1bid > p2bid && a != 5) {
                    p1_money = p1_money - p1bid;
                    document.getElementById("p1").innerHTML = p1 + " Balance: " + p1_money;
                    alert(p1_money + " and " + p2_money);
                    p1_pick[a] = movie_array[i];
                    p1_pick_score[a] = points_array[i];
                    document.getElementById(`p1_pick${a}`).innerHTML = p1_pick[a];
                    a++;
                    drawfunc();
                }

                else if (a == 5 && p1bid > p2bid) {
                    alert("Player 1 already has 5 draws , do not enter bid");
                }

                else if (p2bid > p1bid && b != 5) {
                    p2_money = p2_money - p2bid;
                    document.getElementById("p2").innerHTML = p2 + " Balance: " + p2_money;
                    alert(p1_money + " and " + p2_money);
                    p2_pick[b] = movie_array[i];
                    p2_pick_score[b] = points_array[i];
                    document.getElementById(`p2_pick${b}`).innerHTML = p2_pick[b];
                    b++;
                    drawfunc();
                }

                else if (b == 5 && p2bid > p1bid) {
                    alert("Player 2 already has 5 draws , do not enter bid");
                }

                else if (p1bid == p2bid) {
                    alert("equal bid, change the bid");
                }

            }
            else if (p1bid > p1_money || p2bid > p2_money) {
                alert("Entered bid exceeds balance");
            }
            else {
                alert("Invalid bid");
            }
        }
    </script>
</body>

</html>
